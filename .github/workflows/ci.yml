# Public repo: hosted CI triggers are kept (free Actions minutes). The local
# `act` / `mcli ci preflight` gate still runs before push to catch failures
# early; hosted CI is the authoritative gate on PRs into main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch

jobs:
  test:
    name: Lint, Type-Check, Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type-check
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
