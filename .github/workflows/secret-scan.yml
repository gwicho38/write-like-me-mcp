name: Secret Scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly full scan (Mondays 6am UTC)

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scan the full git history (`git file://.`) instead of the action's
      # diff mode, which exits 1 with "BASE and HEAD commits are the same" on
      # single-commit / initial pushes. Git mode covers every tracked commit,
      # ignores untracked dirs (e.g. .venv), and runs reliably on every event.
      - name: Install TruffleHog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: TruffleHog git scan
        # --no-update: the pinned binary self-update fails on the runner
        # ("cannot move binary back"); we install a fresh binary above already.
        run: trufflehog git file://. --results=verified,unknown --fail --no-update

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

